name: Sync LeetCode public statistics

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and validate public LeetCode data
        run: node scripts/update-leetcode.mjs

      - name: Commit changed JSON only
        run: |
          if git diff --quiet -- public/data/leetcode.json; then
            echo "No generated data changes; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/leetcode.json
          git commit -m "Update LeetCode public statistics"
          git push
